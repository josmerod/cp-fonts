# Build the curated .cpfont families and publish them:
# assets to the rolling `fonts` release, catalog + previews + licenses back to
# main (the plugin reads them via raw.githubusercontent.com).
name: Build fonts

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'  # weekly; picks up upstream WP-Fonts updates
  push:
    paths: ['families.json', 'scripts/build-fonts.mjs', '.github/workflows/build-fonts.yml']

permissions:
  contents: write

concurrency:
  group: build-fonts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # workspace/ (downloaded TTFs + crossglyph's incremental build cache) and
      # tools/ (the crossglyph release) make every run after the first fast.
      - uses: actions/cache@v4
        with:
          path: |
            workspace
            tools
          key: fonts-cg-0.9.1-${{ hashFiles('families.json') }}

      - name: Build families, previews and catalog
        run: >
          node scripts/build-fonts.mjs
          --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/fonts/assets/"
          --raw-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/"

      - name: Commit regenerated catalog, previews and licenses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog previews licenses
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Rebuild font catalog"
            git push
          fi

      # Binaries live on an orphan branch (recreated each run, so no history
      # growth) served directly by raw.githubusercontent.com — no redirects,
      # so the reader downloads each file with a single HTTPS connection
      # instead of relay-HEAD resolving a release redirect first.
      - name: Publish binaries to the raw-served fonts branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ORPHAN="fonts-build-$GITHUB_RUN_ID"
          git checkout --orphan "$ORPHAN"
          git rm -rf --quiet .
          mkdir -p assets
          cp dist/assets/*.cpfont assets/
          git add assets
          git commit -m "font builds"
          git push -f origin "HEAD:fonts"
          git checkout main
          git branch -D "$ORPHAN"
